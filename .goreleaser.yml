version: 2

# Set explicitly, never inferred from the repository GoReleaser runs in, so the archive names stay
# the ones the install instructions name.
project_name: costfluent-mcp

# The release body is the tag's message, which the release workflow passes as --release-notes.
# Given a notes file, GoReleaser builds no changelog from commit subjects, all "Bump to <version>".
# The changelog stays enabled because that step is what loads the file: disabled, it published every
# release with an empty body.

# Two builds, the stdio server and the CLI, which every archive holds side by side: the CLI's
# `mcp install` names the costfluent-mcp beside it, and the Homebrew formula installs both.
builds:
  - id: costfluent-mcp
    main: ./cmd/costfluent-mcp
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    binary: costfluent-mcp
  - id: costfluent
    main: ./cmd/costfluent
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    binary: costfluent

# The macOS server of the MCPB bundle the release workflow packs: an MCPB manifest picks a binary by
# operating system alone, so one universal binary serves both Mac architectures. It is not archived
# (the archives name only the two builds) and so neither uploaded nor in the checksum file; the
# bundle that holds it is attested on its own.
universal_binaries:
  - id: costfluent-mcp-universal
    ids: [costfluent-mcp]
    name_template: costfluent-mcp
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - ids: [costfluent-mcp, costfluent]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

# An SPDX SBOM per archive, written by the syft the release workflow installs from a pinned,
# checksum-verified binary. GoReleaser lists each SBOM in the checksum file, so the provenance
# attestation covers them too.
sboms:
  - artifacts: archive

release:
  draft: false
