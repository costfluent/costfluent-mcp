name: release

# Runs on a vX.Y.Z tag: builds the binaries, attaches them with an SPDX SBOM each and their
# checksums to the release, and attests where they were built, so a user can verify an archive or
# its SBOM with `gh attestation verify`. It also packs the MCPB bundle Claude Desktop installs,
# attaches and attests it, and publishes the server's entry to the MCP Registry.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The MCP Registry gives an OIDC token from any job here the whole io.github.costfluent namespace,
# so each job asks for only what it needs, and only the jobs that attest or publish request a token.
permissions:
  contents: read

jobs:
  # The tests run code from every module the server depends on, so they run in a job of their own
  # whose token can write nothing and request no OIDC token.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # A tag run restores caches the default branch wrote, and a restored module skips the go.sum check.
          cache: false

      # The last chance to stop a broken server before it reaches anyone's assistant.
      - name: Test
        run: go test ./...

  release:
    name: goreleaser
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # goreleaser derives the version from tags, so a shallow clone breaks it.
          fetch-depth: 0

      - name: Setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # A tag run restores caches the default branch wrote, and a restored module skips the go.sum check.
          cache: false

      # The tag's message is the reviewed release notes. The tag is fetched again because checkout
      # can leave an annotated tag lightweight, which has no message.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/notes.md"

      # GoReleaser writes the SBOMs with syft. It is a release binary pinned by version and checksum
      # rather than another action, since the public repositories allow only the actions they list.
      - name: Install syft
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/syft"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/syft" syft
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.19.0
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser names files with the version without its leading v.
      - name: Checksum file
        id: checksums
        env:
          TAG: ${{ github.ref_name }}
        run: echo "path=dist/costfluent-mcp_${TAG#v}_checksums.txt" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}

      # The MCPB bundle: mcpb/manifest.json at its root, stamped with the release's version, and the
      # server binary each platform's command names, from GoReleaser's builds. An MCPB host picks a
      # command by operating system alone, so macOS gets the universal binary and Linux and Windows
      # amd64; an arm64 Windows runs that under emulation. The entries carry a fixed time and mode, so
      # the same binaries pack to the same bundle. The registry entry is server.json with what only
      # the release knows: its version and the bundle's URL and sha256, which an MCP client checks
      # before it installs the bundle.
      - name: MCP bundle and registry entry
        id: bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -I - "${TAG#v}" "$TAG" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT" <<'PY'
          import hashlib, json, os, sys, zipfile

          version, tag, repository = sys.argv[1:]
          builds = {
              "darwin": ("costfluent-mcp-universal", "darwin", "all"),
              "linux": ("costfluent-mcp", "linux", "amd64"),
              "win32": ("costfluent-mcp", "windows", "amd64"),
          }
          artifacts = json.load(open("dist/artifacts.json"))
          manifest = json.load(open("mcpb/manifest.json"))
          manifest["version"] = version
          config = manifest["server"]["mcp_config"]


          def entry(name, mode):
              info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
              info.external_attr = (0o100000 | mode) << 16
              info.compress_type = zipfile.ZIP_DEFLATED
              return info


          bundle = f"dist/costfluent-mcp_{version}.mcpb"
          with zipfile.ZipFile(bundle, "w") as z:
              z.writestr(entry("manifest.json", 0o644), json.dumps(manifest, indent=2) + "\n")
              for platform in manifest["compatibility"]["platforms"]:
                  command = config.get("platform_overrides", {}).get(platform, {}).get("command", config["command"])
                  member = command.removeprefix("${__dirname}/")
                  build, goos, goarch = builds[platform]
                  paths = [a["path"] for a in artifacts if a["type"] == "Binary" and a["extra"]["ID"] == build
                           and a["goos"] == goos and a["goarch"] == goarch]
                  if len(paths) != 1:
                      sys.exit(f"{platform}: want one {build} {goos}/{goarch} binary in dist/artifacts.json, found {paths}")
                  with open(paths[0], "rb") as f:
                      z.writestr(entry(member, 0o755), f.read())
          with open(bundle, "rb") as f:
              sha256 = hashlib.sha256(f.read()).hexdigest()

          server = json.load(open("server.json"))
          server["version"] = version
          [package] = [p for p in server["packages"] if p["registryType"] == "mcpb"]
          package["identifier"] = f"{repository}/releases/download/{tag}/{os.path.basename(bundle)}"
          package["fileSha256"] = sha256
          os.makedirs("dist/registry")
          with open("dist/registry/server.json", "w") as f:
              json.dump(server, f, indent=2)
              f.write("\n")
          print(f"path={bundle}")
          print("registry=dist/registry")
          PY

      - name: Attest the bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.bundle.outputs.path }}

      - name: Attach the bundle
        env:
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$BUNDLE" --repo "$GITHUB_REPOSITORY"

      - name: Upload the registry entry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry
          path: ${{ steps.bundle.outputs.registry }}
          if-no-files-found: error

  # Publishes the entry the release job wrote, after the bundle it names is on the release, since the
  # registry refuses a package URL that does not answer. It checks out, installs and builds nothing.
  mcp-registry:
    name: mcp registry
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The OIDC token mcp-publisher exchanges for the registry's io.github.costfluent namespace.
      id-token: write
    steps:
      - name: Download the registry entry
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry
          path: registry/

      # A release binary pinned by version and checksum, as syft is above.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: 1.8.8
          MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --max-time 120 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher
          echo "$RUNNER_TEMP/mcp-publisher" >> "$GITHUB_PATH"

      - name: Log in to the MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: mcp-publisher publish registry/server.json
